<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Asistente de turnos</title>
  <meta name="description" content="Turnia: recepción con IA para cualquier comercio. Reservas, agenda y asistente conversacional.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Turnia: recepción con IA para cualquier comercio">
  <meta property="og:description" content="Reservá turnos en comercios cerca tuyo y gestioná tu agenda con un asistente de IA.">
  <meta property="og:image" content="/informe/01-inicio.jpg">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E📅%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="/chat.css">
</head>
<body>
  <main class="chat">
    <header class="cabecera">
      <div class="avatar" aria-hidden="true">📅</div>
      <div class="datos">
        <h1>Asistente de turnos</h1>
        <p>en línea</p>
      </div>
      <a class="volver" href="/">Volver</a>
    </header>
    <section id="mensajes" class="mensajes" aria-live="polite"></section>
    <form id="formulario" class="barra-inferior">
      <textarea id="entrada" rows="1" placeholder="Escribí un mensaje" autocomplete="off"></textarea>
      <button id="enviar" class="boton-enviar" type="submit" aria-label="Enviar"></button>
    </form>
  </main>
  <script type="module" src="/chat-pagina.js"></script>
</body>
</html>
